[package]
name = "mwa-tui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
mwa-host = { version = "0.1.0", path = "../host" }
mwa-productmap = { version = "0.1.0", path = "../productmap" }
mwa-protocol = { version = "0.1.0", path = "../protocol" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tokio = { version = "1.54.1", features = ["sync", "macros", "rt", "time"] }

[dev-dependencies]
serde_json = "1.0.154"
