[package]
name = "mwa"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
futures = "0.3.34"
mwa-backends = { version = "0.1.0", path = "../backends" }
mwa-capture = { version = "0.1.0", path = "../capture" }
mwa-core = { version = "0.1.0", path = "../core" }
mwa-host = { version = "0.1.0", path = "../host" }
mwa-manual = { version = "0.1.0", path = "../manual" }
mwa-productmap = { version = "0.1.0", path = "../productmap" }
mwa-protocol = { version = "0.1.0", path = "../protocol" }
mwa-server = { version = "0.1.0", path = "../server" }
mwa-source = { version = "0.1.0", path = "../source" }
mwa-tui = { version = "0.1.0", path = "../tui" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3.27.0"
