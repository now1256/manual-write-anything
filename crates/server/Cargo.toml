[package]
name = "mwa-server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.34"
mime_guess = "2.0.5"
mwa-host = { version = "0.1.0", path = "../host" }
mwa-productmap = { version = "0.1.0", path = "../productmap" }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
